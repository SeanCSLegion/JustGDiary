<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>03 · 日记页</title>
<link rel="stylesheet" href="assets/mockup.css">
<script src="assets/ui.js"></script>
</head>
<body>
<script>
/* ==========================================================================
   日记页 · 阅读 / 编辑 / 分享
   结构照抄 iOS Views/Diary/DiaryPageView.swift；控件换成 Material 3：
   悬浮玻璃顶栏 → TopAppBar 64dp；底部无动作栏（iOS 也没有）；
   格式栏 → 悬浮 Surface（28dp 圆角、tonal elevation）；分享 sheet → ModalBottomSheet。
   ========================================================================== */

const DIA = { STATUS: 32, GESTURE: 24, NAVBAR: 80, TOPBAR: 64, FORMAT: 56, KEYBOARD: 268 };

/* 正文列宽：min(660, 宽 − 32)；卡片内边距 16（M3 卡片），文字宽 = 列宽 − 32 */
function column(w) { return Math.min(660, w - 32); }

function heroCard(opt) {
  const sub = opt.empty
    ? `<div style="font-size:13px;color:var(--on-surface-variant);margin-top:2px">这一天没有留下日记。</div>`
    : `<div style="display:flex;align-items:center;gap:8px;margin-top:2px">
         ${opt.showTime ? `<span style="font-size:13px;color:var(--on-surface-variant)">21:40</span>` : ""}
         <span style="font-size:13px;color:var(--on-surface-variant)">1 个片段</span>
       </div>
       <div style="display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--on-surface-variant)">
         ${icon("place", { size: 14 })}浦东新区 · 上海市 · 中国
       </div>`;
  return `<div class="card" style="margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:20px;font-weight:500">9月8日 周二</span>
      ${opt.today ? `<span style="font-size:12px;font-weight:500;background:var(--primary);color:var(--on-primary);border-radius:999px;padding:3px 8px">今日</span>` : ""}
    </div>
    ${sub}
  </div>`;
}

function entryCard(opt) {
  const parts = [
    { k: "title", t: "字体样式自检" },
    { k: "body", t: "这一段是正文，用来和下面的标题、引用对比字号。" },
    { k: "heading", t: "小标题" },
    { k: "quote", t: "引用块比正文小一级，并且有自己的底色。" },
    { k: "body", t: "这一段带<b>粗体</b>、<i>斜体</i>、<u>下划线</u>和<s>删除线</s>。" },
    { k: "body center", t: "这一行是居中的正文。" },
  ];
  const body = parts.map(p => {
    const isCenter = p.k.includes("center");
    const cls = p.k.replace(" center", "") === "body" ? "rp" : p.k.replace(" center", "");
    return `<div class="${cls}" style="${isCenter ? "text-align:center;" : ""}">${p.t}</div>`;
  }).join("") + `<div class="todo"><span class="cbox on"></span><span style="text-decoration:line-through;color:var(--on-surface-variant)">验证标题层级</span></div>
    <div class="todo"><span class="cbox on"></span><span style="text-decoration:line-through;color:var(--on-surface-variant)">验证引用底色</span></div>
    <div class="todo"><span class="cbox"></span><span>验证行距</span></div>`;
  return `<div class="card" style="padding:16px">
    ${opt.showTime ? `<div class="timeslot" style="margin-bottom:2px">${icon("schedule",{size:14})}21:40</div>` : ""}
    <div style="font-size:12px;color:var(--on-surface-variant);display:flex;align-items:center;gap:6px;margin-bottom:8px">
      ${icon("place",{size:13})}浦东新区 · 上海市 · 中国
    </div>
    <div class="rt">${body}</div>
  </div>`;
}

function diaryTopBar(mode) {
  const back = `<div class="iconbtn">${icon("back")}</div>`;
  let actions = "";
  if (mode === "read") actions = ["search", "edit", "share"].map(i => `<div class="iconbtn">${icon(i)}</div>`).join("");
  if (mode === "edit") actions = ["image", "history", "check"].map((i, k) =>
    `<div class="iconbtn ${k===2?"on":""}">${icon(i)}</div>`).join("");
  if (mode === "select") actions = `<div class="iconbtn" style="color:var(--error)">${icon("delete")}</div>`;
  return `<div class="topbar" style="padding:0 8px">${back}<div class="sp"></div>${actions}</div>`;
}

/* 阅读态 */
function diaryRead(opt) {
  const w = opt.w, col = column(w);
  const bodyH = opt.h - DIA.STATUS - DIA.GESTURE - DIA.NAVBAR;
  const html = `<div style="flex:1;display:flex;flex-direction:column;min-height:0">
    ${diaryTopBar("read")}
    <div style="flex:1;overflow:hidden;padding:10px 0 0;display:flex;flex-direction:column;align-items:center">
      <div style="width:${col}px;flex:1;overflow:hidden">
        ${opt.search ? `<div class="searchbar" style="height:52px;margin-bottom:12px">
            ${icon("search",{size:20})}<span style="flex:1;font-size:15px;color:var(--on-surface)">字体</span>
            <span style="font-size:12px;background:var(--primary-container);color:var(--on-primary-container);border-radius:999px;padding:2px 8px">1/3</span>
            <div class="iconbtn" style="width:40px;height:40px">${icon("expand_more",{size:22,style:"transform:rotate(180deg)"})}</div>
            <div class="iconbtn" style="width:40px;height:40px">${icon("expand_more",{size:22})}</div>
          </div>` : ""}
        ${heroCard({ today: opt.today !== false, empty: opt.empty, showTime: true })}
        ${opt.empty ? "" : entryCard({ showTime: true })}
      </div>
    </div>
    ${navbar("home")}
  </div>`;
  return phone(html, { dark: opt.dark, time: opt.time || "13:52" });
}

/* 编辑态（含键盘与格式栏） */
function diaryEdit(opt) {

  const keyboard = opt.keyboard !== false;
  const html = `<div style="flex:1;display:flex;flex-direction:column;min-height:0;position:relative">

        <div class="card" style="padding:16px">
          <div class="metapill" style="margin-bottom:10px">${icon("schedule",{size:13})}21:40</div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <span style="font-size:13px;color:var(--on-surface-variant)">浦东新区 · 上海市 · 中国</span>
            <span style="font-size:13px;color:var(--primary);font-weight:500">重新获取位置</span>
          </div>
          <div class="rt">
            <div class="title">字体样式自检</div>
            <div class="body">这一段是正文，用来和下面的标题、引用对比字号。<span style="display:inline-block;width:2px;height:18px;background:var(--primary);vertical-align:-4px"></span></div>
            <div class="heading">小标题</div>

          <div style="color:var(--on-surface-variant);font-size:15px;margin-top:4px">开始记录这一刻的想法…</div>
        </div>
      </div>
    </div>
    ${keyboard ? `<div class="keyboard">
      <div class="krow">${["q","w","e","r","t","y","u","i","o","p"].map(k=>`<div class="k">${k}</div>`).join("")}</div>
      <div class="krow">${["a","s","d","f","g","h","j","k","l"].map(k=>`<div class="k">${k}</div>`).join("")}</div>
      <div class="krow"><div class="k wide">⇧</div>${["z","x","c","v","b","n","m"].map(k=>`<div class="k">${k}</div>`).join("")}<div class="k wide">⌫</div></div>
      <div class="krow"><div class="k wide">?123</div><div class="k">，</div><div class="k space">中文</div><div class="k">。</div><div class="k wide">↵</div></div>
    </div>` : ""}
    <div style="position:absolute;left:0;right:0;bottom:${keyboard ? 8 : 24}px;display:flex;justify-content:center;padding:0 12px">
      <div class="formatbar">${formatButtons()}</div>
    </div>
  </div>`;
  return phone(html, { dark: opt.dark, time: opt.time || "13:53" });
}

/** 格式栏 9 项：段落样式 · 居中 ‖ 列表 · 引用 · 待办 ‖ B I S U */
function formatButtons(active) {
  const on = active || ["bold"];
  const b = (name, label, force) =>
    `<div class="fb ${(force === undefined ? on.includes(name) : force) ? "on" : ""}" title="${label}">${icon(name, { size: 20 })}</div>`;
  return [
    b("format_size", "段落样式", false),
    b("align_center", "居中", false),
    `<div class="sep"></div>`,
    b("list", "列表", false),
    b("quote", "引用", false),
    b("checklist", "待办", false),
    `<div class="sep"></div>`,
    b("bold", "粗体"),
    b("italic", "斜体"),
    b("strikethrough", "删除线"),
    b("underline", "下划线"),
  ].join("");
}

        ${heroCard({ today: opt.today !== false, empty: opt.empty, showTime: true })}
        ${opt.empty ? "" : entryCard({ showTime: true })}
      </div>
    </div>
    ${navbar("home")}
  </div>`;
  return phone(html, { dark: opt.dark, time: opt.time || "13:52" });
}

/* 平板横屏：日记页仍是单列，只是列宽被 660 卡住居中 */
function diaryTabletLandscape(opt) {
  const W = 1280, H = 800;
  const col = 660;
  const html = `<div style="flex:1;display:flex;min-height:0">
    ${rail("home", { fab: false })}
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      ${diaryTopBar("read")}

          ${heroCard({ today: true, showTime: true })}

        </div>
      </div>
    </div>
  </div>`;
  return `<div class="device tablet land${opt.dark ? " dark" : ""}"><div class="screen">${statusbar("13:52")}${html}${gesturebar()}</div></div>`;
}
